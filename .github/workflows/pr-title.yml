name: pr-title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  # A required check must report in the merge queue too. There is no title to
  # check there, so the job is skipped, which counts as passing.
  merge_group:

permissions: {}

jobs:
  pr-title:
    name: Check the title is a conventional commit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if ! grep -qE "${pattern}" <<<"${TITLE}"; then
            echo "The title is not a conventional commit: ${TITLE}"
            echo "Use type(scope): subject, with the issue number as the scope. Example: feat(12): add claim lease"
            echo "type is one of feat, fix, docs, style, refactor, perf, test, build, ci, chore or revert."
            exit 1
          fi
          echo "Title is a conventional commit: ${TITLE}"

  # Here, not in check.yml, because this workflow also runs when a pull request
  # is edited: a corrected title or description re-runs the check that read it.
  attribution:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: make check/attribution PR="$PR"
