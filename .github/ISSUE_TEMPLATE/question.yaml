name: Question
description: Ask how factory works or how to set it up.
labels:
  - question
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What do you want to know?
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you tried
      description: The docs you read and the steps you took, so the answer does not repeat them.
