# Runs `factory migrate up` before the server is installed or upgraded. If it fails, Helm aborts the
# release and the pods from the previous release keep serving. A failed Job stays for inspection until the
# next attempt replaces it.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "factory.fullname" . }}-migrate
  labels:
    {{- include "factory.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  template:
    metadata:
      # Not the server's selector labels, so the Service never routes to this pod.
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}-migrate
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      # A pre-install hook runs before the chart's ServiceAccount exists, and needs no API access.
      automountServiceAccountToken: false
      securityContext:
        {{- include "factory.podSecurityContext" . | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "factory.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate", "up"]
          env:
            {{- include "factory.databaseEnv" . | nindent 12 }}
          securityContext:
            {{- include "factory.containerSecurityContext" . | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
