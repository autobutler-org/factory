# Values for the autobutler AKS cluster (Kubernetes 1.37). The deploy workflow installs the chart with these and
# image.tag set to the release tag (docs/operations.md, Deploying a release):
#
#   helm upgrade --install factory deploy/chart -n factory \
#     -f deploy/chart/values-autobutler.yaml --set image.tag=<release>
#
# The server runs in `factory`, workers in `factory-workers` (Pod Security restricted, ResourceQuota `workers`).
# Both namespaces exist already; the chart creates neither.

# Images come from ghcr.io/autobutler-org, the chart defaults.

# The Postgres URL Secret in `factory`.
database:
  secretName: factory-database
  secretKey: url

# Azure will not create the managed flexible server for our subscription, so Postgres runs in the cluster for now,
# with no backups. The URL in factory-database points at it (docs/operations.md, In-cluster Postgres).
postgres:
  enabled: true
  passwordSecretName: factory-postgres
  persistence:
    size: 32Gi
    # Keep the Azure disk when the claim is deleted. It is still deleted with the cluster.
    retainStorageClass:
      create: true
      skuName: StandardSSD_LRS
  # The system pool (linux/amd64). The arm64 worker pool is tainted, and this keeps Postgres off it regardless.
  nodeSelector:
    kubernetes.io/os: linux
    kubernetes.io/arch: amd64

# The GitHub App that mints workers' repository tokens. The id is not secret; the private key Secret is in
# `factory` with the key private-key.pem.
github:
  appId: "5304111"
  privateKeySecretName: factory-github-app

# ClusterIP: the Service is plain HTTP with no sign-in, so it stays off the internet until #56. Reach it with
# kubectl port-forward. factory.cloud.autobutler.org points at the public IP these annotations name, which a
# LoadBalancer Service attaches once #56 lands.
service:
  type: ClusterIP
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-resource-group: autobutler-factory
    service.beta.kubernetes.io/azure-pip-name: autobutler-factory-ingress-pip

launcher:
  enabled: true
  # Repositories may run in images built from the worker image under ghcr.io/autobutler-org
  # (docs/operations.md, "Giving a repository its own tools").
  allowedImages:
    - ghcr.io/autobutler-org/
  # The worker node pool (arm64).
  nodeSelector:
    factory.autobutler.org/workers: "true"
  tolerations:
    - key: factory.autobutler.org/workers
      value: "true"
      effect: NoSchedule
  # The cluster has no gVisor RuntimeClass.
  runtimeClassName: ""

workers:
  namespace: factory-workers
  egress:
    # Helm replaces lists, so this repeats the chart's defaults (GitHub and the model API) and adds the package
    # registries a gate downloads from. The gate's HOME is empty on every run, so nothing is cached between runs.
    # One list for every repository's workers.
    fqdns:
      - github.com
      - api.github.com
      - codeload.github.com
      - "*.githubusercontent.com"
      - api.anthropic.com
      # Dart and Flutter packages and SDK artifacts.
      - pub.dev
      - storage.googleapis.com
      # Go modules.
      - proxy.golang.org
      # npm packages and Node headers.
      - registry.npmjs.org
      - nodejs.org
      # quark's release container, public and read-only; one of its backend unit tests lists it.
      - quarkrelease.blob.core.windows.net

# The cluster's CNI is Cilium with FQDN egress policy available.
networkPolicy:
  enabled: true
  cilium: true

metrics:
  podMonitor:
    # Managed Prometheus picks up azmonitoring.coreos.com/v1 PodMonitors, but there is no /metrics yet (#13).
    enabled: false
